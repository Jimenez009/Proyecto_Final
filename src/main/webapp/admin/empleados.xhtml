<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:h="http://xmlns.jcp.org/jsf/html"
      xmlns:f="http://xmlns.jcp.org/jsf/core"
      xmlns:p="http://primefaces.org/ui">
<h:head>
    <title>Gestión de Empleados</title>
    <h:outputStylesheet library="css" name="estilos.css" />
</h:head>
<h:body>

    <h:form id="formMenu">
        <p:menubar>
            <p:menuitem value="Dashboard" icon="pi pi-fw pi-home" url="dashboard.xhtml" />
            <p:menuitem value="Empleados" icon="pi pi-fw pi-users" url="empleados.xhtml" />
            <p:menuitem value="Puestos" icon="pi pi-fw pi-briefcase" url="puestos.xhtml" />
            <p:menuitem value="Usuarios" icon="pi pi-fw pi-user" url="usuarios.xhtml" />
            <p:menuitem value="Marcaciones" icon="pi pi-fw pi-clock" url="marcaciones.xhtml" />
            <p:divider layout="vertical" />
            <p:menuitem value="Cerrar Sesión" icon="pi pi-fw pi-power-off" action="#{loginBean.cerrarSesion}" />
        </p:menubar>
    </h:form>

    <h:form id="formEmpleados" styleClass="main-form">
        <p:growl id="messages" showDetail="true" />

        <p:panel header="Listado de Empleados">
            <p:commandButton value="Nuevo Empleado" icon="pi pi-plus"
                             actionListener="#{empleadoBean.prepararNuevoEmpleado}"
                             update=":formNuevoEmpleado"
                             oncomplete="PF('dlgEmpleado').show()"
                             styleClass="ui-button-success mb-10px" />

            <p:dataTable id="dtEmpleados" value="#{empleadoBean.listaEmpleados}" var="emp"
                         paginator="true" rows="10" paginatorPosition="bottom" responsiveLayout="scroll">
                <p:column headerText="ID">
                    <h:outputText value="#{emp.idEmpleado}" />
                </p:column>
                <p:column headerText="Nombre">
                    <h:outputText value="#{emp.nombre}" />
                </p:column>
                <p:column headerText="Apellido">
                    <h:outputText value="#{emp.apellido}" />
                </p:column>
                <p:column headerText="Identidad">
                    <h:outputText value="#{emp.identidad}" />
                </p:column>
                <p:column headerText="Puesto">
                    <h:outputText value="#{emp.puesto.nombre}" />
                </p:column>
                <p:column headerText="Acciones" style="text-align: center; width: 100px;">
                    <p:commandButton icon="pi pi-trash" styleClass="ui-button-danger rounded-button"
                                     action="#{empleadoBean.eliminar(emp)}"
                                     update=":formEmpleados:dtEmpleados :formEmpleados:messages">
                        <p:confirm header="Confirmación" message="¿Estás seguro de eliminar a este empleado?" icon="pi pi-info-circle"/>
                    </p:commandButton>
                </p:column>
            </p:dataTable>
        </p:panel>
    </h:form>

    <!-- Diálogo Registrar Empleado y Cuenta de Usuario -->
    <p:dialog header="Registrar Empleado" widgetVar="dlgEmpleado" modal="true" showEffect="fade" hideEffect="fade" resizable="false">
        <h:form id="formNuevoEmpleado">
            <div class="ui-fluid">
                <!-- Datos del Empleado -->
                <div class="mb-1">
                    <p:outputLabel for="nombre" value="Nombre *" />
                    <p:inputText id="nombre" value="#{empleadoBean.nuevoEmpleado.nombre}" required="true" />
                </div>
                <div class="mb-1">
                    <p:outputLabel for="apellido" value="Apellido *" />
                    <p:inputText id="apellido" value="#{empleadoBean.nuevoEmpleado.apellido}" required="true" />
                </div>
                <div class="mb-1">
                    <p:outputLabel for="identidad" value="Identidad *" />
                    <p:inputText id="identidad" value="#{empleadoBean.nuevoEmpleado.identidad}" required="true" />
                </div>
                <div class="mb-1-5">
                    <p:outputLabel for="puesto" value="Puesto *" />
                    <p:selectOneMenu id="puesto" value="#{empleadoBean.nuevoEmpleado.puesto.idPuesto}" required="true">
                        <f:selectItem itemLabel="Seleccione un puesto" itemValue="" />
                        <f:selectItems value="#{puestoBean.listaPuestos}" var="p" itemLabel="#{p.nombre}" itemValue="#{p.idPuesto}" />
                    </p:selectOneMenu>
                </div>

                <!-- Datos para la Cuenta de Usuario -->
                <p:divider align="left">
                    <span class="ui-badge">Cuenta de Acceso</span>
                </p:divider>

                <div class="mb-1">
                    <p:outputLabel for="username" value="Usuario *" />
                    <p:inputText id="username" value="#{empleadoBean.username}" required="true" />
                </div>

                <div class="mb-1">
                    <p:outputLabel for="password" value="Contraseña *" />
                    <p:password id="password" value="#{empleadoBean.password}" required="true" feedback="false" />
                </div>

                <div class="mb-1-5">
                    <p:outputLabel for="rol" value="Rol de Acceso *" />
                    <p:selectOneMenu id="rol" value="#{empleadoBean.rol}" required="true">
                        <f:selectItem itemLabel="Empleado / Usuario" itemValue="USER" />
                        <f:selectItem itemLabel="Administrador" itemValue="ADMIN" />
                        <f:selectItem itemLabel="Supervisor" itemValue="SUPERVISOR" />
                        <f:selectItem itemLabel="Gerente" itemValue="GERENTE" />
                    </p:selectOneMenu>
                </div>

                <p:commandButton value="Guardar" action="#{empleadoBean.guardar}"
                                 update=":formEmpleados:dtEmpleados :formEmpleados:messages formNuevoEmpleado"
                                 oncomplete="if(!args.validationFailed) PF('dlgEmpleado').hide();" />
            </div>
        </h:form>
    </p:dialog>

    <!-- Diálogo de confirmación global para PrimeFaces -->
    <p:confirmDialog global="true" showEffect="fade" hideEffect="fade" responsive="true" width="350">
        <p:commandButton value="No" type="button" styleClass="ui-confirmdialog-no ui-button-flat"/>
        <p:commandButton value="Sí" type="button" styleClass="ui-confirmdialog-yes ui-button-danger" />
    </p:confirmDialog>

</h:body>
</html>
