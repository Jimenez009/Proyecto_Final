<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:h="http://xmlns.jcp.org/jsf/html"
      xmlns:p="http://primefaces.org/ui">
<h:head>
    <title>Iniciar Sesión - Sistema Entrada/Salida</title>
    <h:outputStylesheet name="css/estilos.css" />
</h:head>
<h:body style="display:flex; justify-content:center; align-items:center; height:100vh; margin:0; background-color:#f4f6f9;">

    <h:form id="formLogin">
        <p:growl id="messages" showDetail="true" />

        <p:card style="width: 25rem; margin: 1em auto; padding:1rem;">
            <div style="text-align:center; margin-bottom: 1.5rem;">
                <h3>Acceso al Sistema</h3>
            </div>

            <div class="ui-fluid">
                <div style="margin-bottom: 1rem;">
                    <p:outputLabel for="user" value="Usuario" />
                    <p:inputText id="user" value="#{loginBean.username}" required="true" />
                </div>

                <div style="margin-bottom: 1.5rem;">
                    <p:outputLabel for="pass" value="Contraseña" />
                    <p:password id="pass" value="#{loginBean.password}" required="true" />
                </div>

                <p:commandButton value="Ingresar" action="#{loginBean.iniciarSesion}" update="messages" icon="pi pi-sign-in" />
            </div>
        </p:card>
    </h:form>

</h:body>
</html>
